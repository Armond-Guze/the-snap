name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Public build configuration belongs in GitHub repository variables.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION || '2025-05-03' }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://thegamesnap.com' }}
      # Prisma generate needs syntactically valid URLs; CI does not connect to them.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/the_snap_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:5432/the_snap_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate public build configuration
        shell: bash
        run: |
          missing=()
          [ -z "$NEXT_PUBLIC_SANITY_PROJECT_ID" ] && missing+=("NEXT_PUBLIC_SANITY_PROJECT_ID")
          [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] && missing+=("NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing GitHub repository variables: ${missing[*]}"
            exit 1
          fi

      - name: Install dependencies
        env:
          NODE_OPTIONS: "--use-system-ca"
        run: npm ci

      - name: Lint
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npm run build
